in:12px 0 10px}.hero p{font-size:13px;color:#e3e9df;line-height:1.6;margin:0;max-width:470px}.hero-meta{display:flex;gap:22px;margin-top:22px;font:10px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;color:#d4dfd4}.hero-meta span{display:flex;gap:7px;align-items:center}.dot{width:5px;height:5px;border-radius:50%;background:#c9ae68}.overview{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.left-col,.right-col{display:flex;flex-direction:column;gap:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}.wealth-card{padding:20px 22px 16px}.section-head{display:flex;justify-content:space-between;align-items:center}.section-title{font:600 13px 'Playfair Display';letter-spacing:.01em}.mono{font:10px 'DM Mono';letter-spacing:.06em;color:var(--muted)}.wealth-total{display:flex;align-items:baseline;gap:10px;margin:9px 0 2px}.wealth-total strong{font:500 32px 'Playfair Display';letter-spacing:-.02em}.change{font:10px 'DM Mono';color:var(--green2);background:#edf4e9;padding:5px 7px;border-radius:2px}.chart-wrap{height:93px;margin:6px -4px 0;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-labels{display:flex;justify-content:space-between;font:9px 'DM Mono';color:#9ba39c;padding:0 2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid var(--line);padding-top:13px}.stat{padding:0 11px;border-right:1px solid var(--line)}.stat:first-child{padding-left:0}.stat:last-child{border:0}.stat label{display:block;color:var(--muted);font:9px 'DM Mono';text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}.stat b{font:500 15px 'DM Sans'}.stat small{display:block;font:10px 'DM Sans';color:#89938b;margin-top:3px}.right-col .card{padding:19px 20px}.score-card{background:#edf1e8}.score-number{font:500 32px 'Playfair Display';color:var(--green);margin:13px 0 3px}.score-sub{font:11px 'DM Sans';color:var(--muted)}.progress{height:4px;background:#d8df auto;padding-top:12px}.move-price{font:10px 'DM Mono';color:var(--green2)}.move-arrow{color:#9aaa97;font-size:15px}.move-card.locked{opacity:.5;pointer-events:none}.bottom-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:20px}.event-card{padding:19px 20px;display:flex;gap:15px;align-items:flex-start;background:#f1eee4}.event-icon{width:34px;height:34px;flex:none;border:1px solid #d6cba9;border-radius:50%;display:grid;place-items:center;color:#8e7543;font-size:15px}.event-title{font:500 15px 'Playfair Display';margin:5px 0 5px}.event-body{font-size:11px;color:#68756b;line-height:1.5;margin:0}.event-tag{font:9px 'DM Mono';letter-spacing:.1em;color:#957a43;text-transform:uppercase}.action-card{padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.action-title{font:500 14px 'Playfair Display';margin-bottom:4px}.action-hint{font:10px 'DM Sans';color:var(--muted)}.advance{border:0;background:var(--green);color:white;border-radius:3px;padding:13px 16px;min-width:118px;font:10px 'DM Mono';letter-spacing:.03em;transition:background .2s}.advance:hover{background:#173c2b}.advance:disabled{opacity:.4;cursor:not-allowed}.tabs{display:flex;position:absolute;top:14px;right:265px;height:44px;gap:4px;align-items:center;background:transparent}.tab{border:0;background:transparent;color:#89948a;display:flex;align-items:center;gap:5px;font:9px 'DM Mono';padding:8px}.tab .tab-icon{font-size:15px}.tab.active{color:var(--green)}.footer{padding:27px 38px 0;display:flex;justify-content:space-between;color:#929a91;font:9px 'DM Mono';letter-spacing:.05em}.toast{position:fixed;z-index:20;bottom:24px;left:50%;transform:translate(-50%,20px);background:#18392e;color:white;padding:12px 17px;border-radius:3px;box-shadow:0 9px 30px #0003;font:11px 'DM Sans';opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#111b18a8;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.modal-back.show{display:flex}.modal{width:min(440px,100%);background:var(--paper);padding:26px;border-radius:4px;box-shadow:0 20px 70px #0004}.modal h2{font:500 25px 'Playfair Display';margin:8px 0}.modal p{font-size:12px;color:#66736a;line-height:1.55}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions button{flex:1;padding:13px;border-radius:3px;border:1px solid var(--line);background:white;font:10px 'DM Mono'}.modal-actions .confirm{background:var(--green);border-color:var(--green);color:white}.portfolio-list{margin-top:15px}.asset-row{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:11px}.asset-row strong{font-weight:600}.asset-row span{color:var(--muted);font:10px 'DM Mono'}.ledger-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.ledger-item:last-child{border:0}.ledger-year{font:10px 'DM Mono';color:var(--green2);min-width:38px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.ending{padding:20px;border:1px solid #d4dfd0;background:#eef3eb;border-radius:4px;margin-bottom:18px}.ending h2{font:500 23px 'Playfair Display';margin:7px 0}.ending p{font-size:12px;color:#69766a;margin:0;line-height:1.5}
@media(max-width:760px){body{background:var(--paper)}.shell{padding-bottom:calc(68px + env(safe-area-inset-bottom))}.topbar{height:59px;padding:0 18px}.brand-mark{width:30px;height:30px}.top-right{gap:7px}.main{padding:17px 16px 0}.hero{min-height:182px;padding:22px 20px;margin-bottom:13px}.hero:after{right:-210px;top:-60px}.hero h1{font-size:32px}.hero p{font-size:11px;max-width:300px}.hero-meta{gap:13px;margin-top:15px;font-size:8px}.overview{grid-template-columns:1fr;gap:12px}.left-col,.right-col{gap:12px}.wealth-card{padding:16px}.wealth-total strong{font-size:29px}.chart-wrap{height:78px}.right-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.right-col .card{padding:15px}.score-number{font-size:27px;margin:9px 0 1px}.yield-value{font-size:20px}.yield-card .yield-main{margin:12px 0 10px}.legend{gap:7px;font-size:8px}.legend i{margin-right:2px}.section-row{margin:20px 0 10px}.section-row h2{font-size:19px}.moves{grid-template-columns:1fr;gap:9px}.move-card{min-height:0;padding:13px;display:grid;grid-template-columns:38px 1fr auto;column-gap:11px;align-items:center}.move-icon{margin:0;grid-row:1/3}.move-name{align-self:end;margin:0}.move-desc{grid-column:2;min-height:0;font-size:10px}.move-bottom{grid-column:3;grid-row:1/3;padding:0;margin:0;gap:9px}.move-arrow{display:none}.bottom-grid{grid-template-columns:1fr;gap:10px;margin-top:13px}.event-card{padding:15px}.event-title{font-size:14px}.event-body{font-size:10px}.action-card{padding:13px 14px}.advance{padding:12px 12px;min-width:112px}.tabs{position:fixed;display:flex;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);height:calc(60px + env(safe-area-inset-bottom));padding:5px 16px env(safe-area-inset-bottom);background:#fbfaf6;border-top:1px solid var(--line);justify-content:space-around;align-items:center}.tab{border:0;background:transparent;color:#89948a;display:flex;flex-direction:column;align-items:center;gap:3px;font:9px 'DM Mono';min-width:70px;padding:5px}.tab .tab-icon{font-size:17px;line-height:1}.tab.active{color:var(--green)}.footer{display:none}.toast{bottom:calc(74px + env(safe-area-inset-bottom))}.move-count{font-size:8px;padding:6px 7px}}
@media(max-width:370px){.hero h1{font-size:28px}.hero-meta{gap:8px}.right-col .card{padding:12px}.score-number{font-size:24px}.legend{gap:4px}.legend span{font-size:7px}}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<script>
const START={year:2026,cash:1250000,assets:[],trust:0,education:0,philanthropy:0,reputation:34,actions:0,history:[],logs:[],ended:false};
const deals=[
 {id:'rail',name:'Regional Rail',icon:'↗',kind:'Infrastructure',cost:420000,yield:.095,growth:.035,desc:'A vital freight corridor with steady contracts.',risk:'Low',color:'#315c41'},
 {id:'mill',name:'Timber & Paper Mill',icon:'⌂',kind:'Industry',cost:310000,yield:.12,growth:.025,desc:'Acquire a profitable local mill and its workforce.',risk:'Medium',color:'#829d73'},
 {id:'land',name:'Riverfront Acreage',icon:'⌁',kind:'Real estate',cost:260000,yield:.035,growth:.105,desc:'Patiently hold land on the edge of a growing city.',risk:'Medium',color:'#bd9750'},
 {id:'utility',name:'City Electric Works',icon:'ϟ',kind:'Utilities',cost:510000,yield:.075,growth:.06,desc:'Power a growing city through a regulated utility.',risk:'Low',color:'#768da0'},
 {id:'fund',name:'Diversified Holdings',icon:'◉',kind:'Public markets',cost:180000,yield:.055,growth:.075,desc:'A broad basket of established enterprises.',risk:'Balanced',color:'#93756c'}
];
const events=[
 {title:'A season of expansion',body:'New trade routes bring fresh customers to established businesses. Your operating companies see a modest lift.',effect:s=>{s.cash+=35000;return '+$35,000 operating surplus';}},
 {title:'A difficult harvest',body:'A poor growing season ripples through the economy. Careful reserves soften the blow, but income slips this year.',effect:s=>{s.cash-=25000;return '−$25,000 in costs';}},
 {title:'A trusted name',body:'Your steady stewardship earns the confidence of partners and civic leaders.',effect:s=>{s.reputation=Math.min(100,s.reputation+3);return '+3 reputation';}},
 {title:'A new generation steps forward',body:'A younger family member asks to join the family council and learn the business.',effect:s=>{s.education+=10000;return '$10,000 added to family learning';}},
 {title:'Market uncertainty',body:'A period of uncertainty trims the value of some holdings. Long-term investors keep their focus.',effect:s=>{s.assets.forEach(a=>a.value*=.97);return 'Portfolio values −3%';}},
 {title:'Community honors',body:'A local institution recognizes your family’s long-term support of the community.',effect:s=>{s.reputation=Math.min(100,s.reputation+5);return '+5 reputation';}},
 {title:'A promising decade',body:'Steady growth across the region lifts demand for the services your businesses provide.',effect:s=>{s.assets.forEach(a=>a.value*=1.025);return 'Portfolio values +2.5%';}}
];
let state=load();let view='home';let selected=null;let toastTimer;
function load(){try{const saved=JSON.parse(localStorage.getItem('evergreen-save'));return saved?{...structuredClone(START),...saved}:structuredClone(START)}catch{return structuredClone(START)}}
function save(){localStorage.setItem('evergreen-save',JSON.stringify(state))}
const money=n=>'$'+Math.round(n).toLocaleString('en-US');const compact=n=>n>=1e6?'$'+(n/1e6).toFixed(2)+'m':n>=1000?'$'+Math.round(n/1000)+'k':money(n);
function wealth(){return state.cash+state.trust+state.assets.reduce((n,a)=>n+a.value,0)}
function income(){return state.assets.reduce((n,a)=>n+a.value*a.yield,0)+state.trust*.045}
function legacyScore(){return Math.round(Math.min(100,(wealth()/10000000)*45+state.reputation*.28+Math.min(state.education/10000,10)*1.1+Math.min(state.philanthropy/50000,10)*1.1+state.assets.length*2))}
function fmtYear(){return state.year+' / 2045'}
function svgChart(){let vals=state.history.map(x=>x.wealth);vals.push(wealth());if(vals.length<2)vals=[wealth()*.94,wealth()];let min=Math.min(...vals)*.94,max=Math.max(...vals)*1.02,range=max-min||1;let pts=vals.map((v,i)=>`${i/(vals.length-1)*100},${72-(v-min)/range*60}`).join(' ');return `<svg viewBox="0 0 100 80" preserveAspectRatio="none" aria-label="Wealth over time"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6c9878" stop-opacity=".24"/><stop offset="1" stop-color="#6c9878" stop-opacity="0"/></linearGradient></defs><polygon points="0,80 ${pts} 100,80" fill="url(#fill)"/><polyline points="${pts}" fill="none" stroke="#326b4f" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>${vals.length?`<circle cx="100" cy="${72-(vals[vals.length-1]-min)/range*60}" r="2.3" fill="#326b4f" vector-effect="non-scaling-stroke"/>`:''}</svg>`}
function moveCard(id,icon,name,desc,cost,label,disabled=false){return `<article class="move-card card ${disabled?'locked':''} ${selected===id?'selected':''}" data-move="${id}"><div class="move-icon">${icon}</div><div class="move-name">${name}</div><div class="move-desc">${desc}</div><div class="move-bottom"><span class="move-price">${label||cost}</span><span class="move-arrow">↗</span></div></article>`}
function render(){const wealthNum=wealth(),score=legacyScore(),canAct=state.actions<1&&!state.ended;let event=events[(Math.floor((state.year-2026)/2)+1)%events.length];let earnings=income();
const header=`<header class="topbar"><div class="brand"><div class="brand-mark">E</div><div><div class="brand-name">EVERGREEN</div><div class="brand-sub">A LEGACY BUILDER</div></div></div><div class="top-right"><span>PRIVATE FAMILY OFFICE</span><button class="reset-btn" aria-label="New game" title="Start a new legacy" onclick="confirmReset()">↻</button></div></header>`;
const hero=`<section class="hero"><div class="hero-copy"><div class="eyebrow">A family enterprise · ${fmtYear()}</div><h1>Build beyond<br>your own lifetime.</h1><p>Grow enduring businesses, steward capital wisely, and prepare the next generation to carry your name forward.</p><div class="hero-meta"><span><i class="dot"></i>Generation ${Math.min(5,Math.floor((state.year-2026)/4)+1)}</span><span>◷ &nbsp;${Math.max(0,20-(state.year-2026))} YEARS LEFT</span></div></div></section>`;
const overview=`<div class="overview"><div class="left-col"><section class="card wealth-card"><div class="section-head"><div class="section-title">Family wealth</div><div class="mono">TOTAL ESTATE</div></div><div class="wealth-total"><strong>${compact(wealthNum)}</strong><span class="change">↗ ${state.history.length?((wealthNum/state.history[0].wealth-1)*100).toFixed(1):'0.0'}%</span></div><div class="chart-wrap">${svgChart()}</div><div class="chart-labels"><span>FOUNDING YEAR</span><span>NOW · ${state.year}</span></div><div class="stats"><div class="stat"><label>Liquid capital</label><b>${compact(state.cash)}</b><small>Available to deploy</small></div><div class="stat"><label>Annual income</label><b>${compact(earnings)}</b><small>From productive assets</small></div><div class="stat"><label>Holdings</label><b>${state.assets.length+ (state.trust>0?1:0)}</b><small>Across ${new Set(state.assets.map(a=>a.kind)).size} sectors</small></div></div></section></div><div class="right-col"><section class="card score-card"><div class="section-head"><div class="section-title">Legacy index</div><div class="mono">OUT OF 100</div></div><div class="score-number">${score}<span style="font:12px 'DM Sans';color:#7b887b"> / 100</span></div><div class="score-sub">${score<35?'A foundation taking shape':score<65?'A respected family institution':score<85?'A lasting dynasty':'An extraordinary legacy'}</div><div class="progress"><i style="width:${score}%"></i></div><div class="score-foot"><span>BUILDING A LEGACY</span><span>${score>=100?'COMPLETE':'GOAL 100'}</span></div></section><section class="card yield-card"><div class="section-head"><div class="section-title">Capital mix</div><div class="mono">PORTFOLIO</div></div><div class="yield-main"><div class="yield-value">${compact(state.assets.reduce((n,a)=>n+a.value,0)+state.trust)}</div><div class="yield-note">${state.assets.length?state.assets.length+' ACTIVE HOLDINGS':'READY TO INVEST'}</div></div><div class="yield-bar"><span></span><span></span><span></span></div><div class="legend"><span><i style="background:#315c41"></i>Business</span><span><i style="background:#829d73"></i>Land</span><span><i style="background:#d0bb82"></i>Trust</span></div></section></div></div>`;
const moveSection=`<div class="section-row"><div><h2>Make your move</h2><p>One defining decision each year. Choose with care.</p></div><span class="move-count">${state.ended?'LEGACY COMPLETE':canAct?'1 MOVE AVAILABLE':'MOVE MADE'}</span></div><div class="moves">${moveCard('deal','⌂','Acquire an enterprise','Buy a durable business or long-term holding.','', 'EXPLORE DEALS',!canAct)}${moveCard('trust','◈','Create a family trust','Set aside capital for continuity and stewardship.',money(250000),'SECURE THE FUTURE',!canAct||state.cash<250000)}${moveCard('academy','✦','Educate the next generation','Invest in a capable, principled family council.',money(60000),'INVEST IN PEOPLE',!canAct||state.cash<60000)}${moveCard('give','♡','Give with intention','Support a lasting community institution.',money(40000),'BUILD GOODWILL',!canAct||state.cash<40000)}${moveCard('council','♧','Form a family council','Strengthen governance and improve your reputation.',money(90000),'SET A COMMON PURPOSE',!canAct||state.cash<90000)}${moveCard('reserve','⌁','Protect the reserve','Build resilience; add a modest guaranteed return.',money(150000),'LOW-RISK 4.5% YIELD',!canAct||state.cash<150000)}${moveCard('hold','—','Hold steady','Skip investing this year and advance with no upfront cost.','$0','NO-COST ADVANCE',!canAct)}</div>`;
let bottom=`<div class="bottom-grid"><section class="card event-card"><div class="event-icon">✧</div><div><div class="event-tag">IN THIS SEASON</div><div class="event-title">${event.title}</div><p class="event-body">${event.body}</p></div></section><section class="card action-card"><div><div class="action-title">${state.ended?'Your story is written':`Year ${state.year} decision`}</div><div class="action-hint">${state.ended?'Start again to build a new legacy.':canAct?'Choose a move, then close the books.':'Your move is set. Ready to advance?'}</div></div><button class="advance" onclick="advanceYear()" ${(state.actions<1&&!state.ended)?'disabled':''}>${state.ended?'NEW LEGACY':'CLOSE THE YEAR →'}</button></section></div>`;
let ending=state.ended?`<section class="ending"><div class="eyebrow">THE FAMILY RECORD · ${state.year}</div><h2>${score>=70?'A legacy that endures.':score>=40?'A foundation for generations.':'Every great story begins somewhere.'}</h2><p>Your family stewarded ${compact(wealthNum)} in wealth, built ${state.assets.length} lasting enterprise${state.assets.length===1?'':'s'}, and finished with a Legacy Index of ${score}. ${state.education?`You invested ${money(state.education)} in future leaders. `:''}${state.philanthropy?`Your giving reached ${money(state.philanthropy)}.`:''}</p></section>`:'';
let content=view==='home'?`${hero}${ending}${overview}${moveSection}${bottom}`:view==='portfolio'?portfolioView():ledgerView();
document.getElementById('app').innerHTML=`<div class="shell">${header}<main class="main">${content}</main><footer class="footer"><span>EVERGREEN FAMILY OFFICE SIMULATOR</span><span>FICTIONAL SCENARIO · FOR PLAY ONLY</span></footer><nav class="tabs"><button class="tab ${view==='home'?'active':''}" onclick="setView('home')"><span class="tab-icon">⌂</span>HOME</button><button class="tab ${view==='portfolio'?'active':''}" onclick="setView('portfolio')"><span class="tab-icon">◫</span>PORTFOLIO</button><button class="tab ${view==='ledger'?'active':''}" onclick="setView('ledger')"><span class="tab-icon">≡</span>FAMILY BOOK</button></nav></div>`;
document.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click',()=>chooseMove(el.dataset.move)));
}
function portfolioView(){let total=state.assets.reduce((n,a)=>n+a.value,0);return `<div class="section-row" style="margin-top:5px"><div><h2>Family portfolio</h2><p>Capital at work, built one generation at a time.</p></div><span class="move-count">${state.assets.length} HOLDINGS</span></div><section class="card wealth-card"><div class="section-head"><div class="section-title">Productive assets</div><div class="mono">${compact(total)} TOTAL VALUE</div></div>${state.assets.length?`<div class="portfolio-list">${state.assets.map((a,i)=>`<div class="asset-row"><strong>${a.name}<br><span style="font:9px 'DM Sans';color:#88938a">${a.kind} · ${a.risk} risk</span></strong><span>${compact(a.value)}<br>value</span><span>${compact(a.value*a.yield)}<br>annual income</span></div>`).join('')}</div>`:`<div class="empty">Your family’s first enterprise is waiting to be acquired.<br>Choose “Explore deals” on the home screen to begin.</div>`}<div class="asset-row" style="border-bottom:1px solid var(--line);margin-top:4px"><strong>Family trust</strong><span>${compact(state.trust)}<br>protected</span><span>${compact(state.trust*.045)}<br>annual income</span></div></section><section class="card wealth-card" style="margin-top:14px"><div class="section-head"><div class="section-title">Stewardship & people</div><div class="mono">NON-FINANCIAL CAPITAL</div></div><div class="stats"><div class="stat"><label>Reputation</label><b>${state.reputation} / 100</b><small>Community standing</small></div><div class="stat"><label>Education</label><b>${compact(state.education)}</b><small>Next-gen investment</small></div><div class="stat"><label>Philanthropy</label><b>${compact(state.philanthropy)}</b><small>Giving to date</small></div></div></section><div class="bottom-grid"><section class="card event-card"><div class="event-icon">✧</div><div><div class="event-tag">A PRINCIPLE TO REMEMBER</div><div class="event-title">Wealth is a responsibility.</div><p class="event-body">Strong family enterprises combine patient capital with good governance, capable people, and a commitment to the communities around them.</p></div></section></div>`}
function ledgerView(){return `<div class="section-row" style="margin-top:5px"><div><h2>Family book</h2><p>A record of decisions, seasons, and the values behind them.</p></div><span class="move-count">${state.logs.length} ENTRIES</span></div><section class="card wealth-card"><div class="section-head"><div class="section-title">Family chronicle</div><div class="mono">${state.year} · ${state.logs.length} YEARS</div></div><div class="portfolio-list">${state.logs.length?state.logs.slice().reverse().map(l=>`<div class="ledger-item"><span class="ledger-year">${l.year}</span><div><strong>${l.title}</strong><div style="color:#7b887e;margin-top:3px">${l.body}</div></div></div>`).join(''):`<div class="empty">The family book is open. Your first annual decision will begin the story.</div>`}</div></section><div class="bottom-grid"><section class="card event-card"><div class="event-icon">✧</div><div><div class="event-tag">THE EVERGREEN PRINCIPLES</div><div class="event-title">Think in generations, not quarters.</div><p class="event-body">Diversify holdings. Preserve reserves. Prepare successors. Let your values guide how capital serves both family and community.</p></div></section></div>`}
function setView(next){view=next;render();window.scrollTo(0,0)}
function chooseMove(id){if(state.ended||state.actions>=1)return;selected=id;
if(id==='deal'){showDeals();return}
if(id==='hold'){state.actions=1;state.logs.push({year:state.year,title:'Held steady',body:'Chose not to make a new investment this year; existing holdings and annual operations continue.'});save();selected=null;notify('No-cost move recorded. You can close the year.');render();return}
const options={trust:{title:'Establish a family trust',amount:250000,ok:s=>{s.trust+=250000;s.reputation=Math.min(100,s.reputation+2);return 'A protected foundation for the next generation.'}},academy:{title:'Invest in family education',amount:60000,ok:s=>{s.education+=60000;s.reputation=Math.min(100,s.reputation+2);return 'Future leaders gain the tools to steward capital.'}},give:{title:'Make a community endowment',amount:40000,ok:s=>{s.philanthropy+=40000;s.reputation=Math.min(100,s.reputation+7);return 'Your family invests in a stronger community.'}},council:{title:'Form a family council',amount:90000,ok:s=>{s.reputation=Math.min(100,s.reputation+9);s.education+=15000;return 'A shared purpose and clear governance strengthen the family.'}},reserve:{title:'Build a protected reserve',amount:150000,ok:s=>{s.trust+=150000;s.reputation=Math.min(100,s.reputation+1);return 'Your reserve is protected and earns a steady 4.5%.'}}};const o=options[id];if(!o||state.cash<o.amount){notify('Not enough liquid capital for this move.');return}confirmModal(o.title,`Commit ${money(o.amount)}? This uses your one strategic move for ${state.year}.`,()=>{state.cash-=o.amount;o.ok(state);state.actions=1;state.logs.push({year:state.year,title:o.title,body:`Committed ${money(o.amount)} toward family continuity.`});save();selected=null;notify('Decision recorded in the family book.');render()});}
function showDeals(){let choices=[...deals].sort(()=>Math.random()-.5).slice(0,3);let html=`<div class="eyebrow">A GENERATIONAL INVESTMENT</div><h2>Explore the deal book</h2><p>Select one enterprise to acquire. Businesses generate annual income and appreciate over time. You can close the deal only if you have enough liquid capital.</p><div class="portfolio-list">${choices.map(d=>`<div class="asset-row" style="grid-template-columns:1fr auto"><div><strong>${d.icon} &nbsp;${d.name}</strong><div style="font:10px 'DM Sans';color:#7c887f;margin-top:4px">${d.desc}</div><span>${d.kind} · ${d.risk} risk · ${(d.yield*100).toFixed(1)}% yield</span></div><button class="confirm" style="border:0;border-radius:3px;padding:10px;background:${state.cash>=d.cost?'#204e3a':'#a9b0a7'};color:white;font:10px 'DM Mono';white-space:nowrap" onclick="buyDeal('${d.id}')">${money(d.cost)}</button></div>`).join('')}</div><div class="modal-actions"><button onclick="closeModal()">BACK</button></div>`;openModal(html)}
function buyDeal(id){let d=deals.find(x=>x.id===id);if(!d||state.cash<d.cost){notify('Not enough liquid capital for this enterprise.');return}state.cash-=d.cost;state.assets.push({id:d.id,name:d.name,kind:d.kind,value:d.cost,yield:d.yield,growth:d.growth,risk:d.risk});state.actions=1;state.logs.push({year:state.year,title:`Acquired ${d.name}`,body:`Invested ${money(d.cost)} in ${d.kind.toLowerCase()} with a ${(d.yield*100).toFixed(1)}% annual yield.`});save();closeModal();selected=null;render();notify(`${d.name} joins your family portfolio.`)}
function confirmModal(title,body,action){openModal(`<div class="eyebrow">FAMILY OFFICE DECISION</div><h2>${title}</h2><p>${body}</p><div class="modal-actions"><button onclick="closeModal()">RECONSIDER</button><button class="confirm" id="modalConfirm">CONFIRM MOVE</button></div>`);document.getElementById('modalConfirm').onclick=()=>{closeModal();action()}}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function advanceYear(){if(state.ended){resetGame();return}if(state.actions<1){notify('Choose one strategic move before closing the year.');return}let before=wealth();let earned=income();state.cash+=earned;state.cash-=65000;state.assets.forEach(a=>a.value*=1+a.growth);state.trust*=1.045;let event=events[(Math.floor((state.year-2026)/2)+1)%events.length];let effect=event.effect(state);state.history.push({year:state.year,wealth:before});let result=`Annual income ${money(earned)}; operating costs $65,000. ${effect}.`;state.logs.push({year:state.year,title:event.title,body:result});state.year++;state.actions=0;selected=null;if(state.year>=2046||legacyScore()>=100)state.ended=true;save();render();window.scrollTo(0,0);notify(`${event.title} · ${effect}`)}
function confirmReset(){confirmModal('Begin a new legacy?',`This will replace your current family record and return to 2026 with ${money(START.cash)} in starting capital.`,resetGame)}
function resetGame(){state=structuredClone(START);view='home';selected=null;save();closeModal();render();window.scrollTo(0,0);notify('A new family story begins.')}
function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
render();
</script>
</body>
</html>
